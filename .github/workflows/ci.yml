name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build production frontend applications
        run: pnpm build

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install backend dependencies and Ruff
        working-directory: apps/api
        run: python -m pip install -r requirements.txt ruff==0.17.5
      - name: Ruff lint changed backend files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            mapfile -t files < <(git ls-files 'apps/api/*.py' 'apps/api/**/*.py')
          else
            changed_files="$(git diff --name-only "$base" "$GITHUB_SHA" -- apps/api)"
            files=()
            while IFS= read -r file; do
              if [[ "$file" == *.py ]]; then
                files+=("$file")
              fi
            done <<< "$changed_files"
          fi

          if ((${#files[@]})); then
            python -m ruff check "${files[@]}"
          else
            echo "No backend Python files changed; Ruff check skipped."
          fi
      - name: Run mypy when configured
        working-directory: apps/api
        shell: bash
        run: |
          configured=false
          for config in mypy.ini .mypy.ini setup.cfg ../../mypy.ini ../../.mypy.ini ../../setup.cfg; do
            if [[ -f "$config" ]] && grep -qE '^\[mypy([.-]|])' "$config"; then
              configured=true
            fi
          done
          for config in pyproject.toml ../../pyproject.toml; do
            if [[ -f "$config" ]] && grep -q '^\[tool\.mypy\]' "$config"; then
              configured=true
            fi
          done

          if [[ "$configured" == true ]]; then
            python -m pip install mypy
            python -m mypy app tests
          else
            echo "::notice::No backend mypy configuration found; skipping type check."
          fi
      - name: Run backend test suite
        working-directory: apps/api
        run: python -m pytest -v
