version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: capabilityos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capabilityos}
      POSTGRES_USER: ${POSTGRES_USER:-capabilityos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capabilityos}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-capabilityos}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: capabilityos-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-capabilityos}:${POSTGRES_PASSWORD:-capabilityos}@postgres:5432/${POSTGRES_DB:-capabilityos}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - '8000:8000'
    volumes:
      - ./apps/api:/app/apps/api

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capabilityos-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - '3000:3000'

volumes:
  postgres-data:
