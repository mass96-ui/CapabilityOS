version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: capabilityos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capabilityos}
      POSTGRES_USER: ${POSTGRES_USER:-capabilityos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capabilityos}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-capabilityos}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capabilityos-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
    ports:
      - '3000:3000'

volumes:
  postgres-data:
