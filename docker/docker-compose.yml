version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capabilityos}
      POSTGRES_USER: ${POSTGRES_USER:-capabilityos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capabilityos}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
